name: Refresh news feed cache

# Pinger news-feed-endepunktet hvert 30. minutt. Se src/app/api/cron/refresh-social-feed/route.ts.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping refresh endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://luckandloadtv.com/api/cron/refresh-social-feed")
          echo "Refresh endpoint svarte HTTP $status"
