name: Snapshot leaderboard at month end

# Pinger snapshot-endepunktet et par ganger mot slutten av hver dag (UTC), og ekstra tidlig den 1.
# Endepunktet bestemmer selv hva som skal gjøres: siste dag i måneden fryses inneværende måned,
# dag 1-3 fryses forrige måned på nytt med endelige tall (sikkerhetsnett -- GitHub-cron kan bli
# forsinket med timer, slik at 23:50-kjøringen havner etter midnatt), ellers ingenting.
# Se src/app/api/cron/snapshot-leaderboard/route.ts for detaljer.
on:
  schedule:
    - cron: '50,58 23 * * *'
    - cron: '17 6 1 * *'
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      # Samme "best effort"-prinsipp som refresh-leaderboard.yml -- skal aldri feile synlig.
      - name: Ping snapshot endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://luckandloadtv.com/api/cron/snapshot-leaderboard")
          echo "Snapshot-endepunktet svarte HTTP $status"
